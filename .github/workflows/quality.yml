name: Backend quality
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore CGM.Backend.slnx
      - run: dotnet test CGM.Backend.slnx --configuration Release --collect:"XPlat Code Coverage" --logger trx --results-directory TestResults
        env: { DB_CONNECTION_STRING: 'Server=test;Database=test;', JWT_SECRET: 'ci-only-secret-that-is-longer-than-32-bytes' }
      - run: dotnet list CGM.Api/CGM.Api.csproj package --vulnerable --include-transitive
      - run: dotnet publish CGM.Api/CGM.Api.csproj --configuration Release --output publish
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: TestResults }
      - uses: actions/upload-artifact@v4
        with: { name: backend-release, path: publish }
  staging:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with: { name: backend-release }
      - run: echo "Deploy the immutable artifact with staging environment credentials, then probe /health."
  production:
    if: github.ref == 'refs/heads/main'
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with: { name: backend-release }
      - run: echo "Production deployment is protected by the repository production environment approval."
